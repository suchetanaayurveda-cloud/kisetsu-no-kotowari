<svg xmlns="http://www.w3.org/2000/svg" width="480.0" height="480.0" viewBox="0 0 120.0 120.0" opacity="1" preserveAspectRatio="xMidYMid meet">
      <defs>
      
    <filter id="e1" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
